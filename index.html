<!-- AUTO PLAY BACKGROUND MUSIC -->
<audio id="bgMusic" autoplay muted loop controls
       style="position:fixed; bottom:20px; left:20px; z-index:9999;">
    <source src="https://cdn.jsdelivr.net/gh/Prashant8181/prashant@main/you-and-me.mp3" type="audio/mpeg">
</audio>

<script>
window.addEventListener("load", function () {
    const music = document.getElementById("bgMusic");

    // Start automatically (muted autoplay is browser-safe)
    music.play().then(() => {
        console.log("Autoplay started");
    }).catch(() => {
        console.log("Autoplay blocked");
    });

    // First click anywhere = unmute
    document.addEventListener("click", function () {
        music.muted = false;
        music.volume = 1;
    }, { once: true });
});
</script>
