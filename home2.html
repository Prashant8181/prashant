<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Viewer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

/* Header */

header{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin-bottom:8px;
}

header p{
    color:#ccc;
}

/* Navigation */

nav{
    background:#222;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding:15px;
}

nav a{
    text-decoration:none;
    color:white;
    background:#444;
    padding:12px 20px;
    border-radius:8px;
    transition:0.3s;
}

nav a:hover{
    background:#e63946;
}

/* PDF Container */

.pdf-container{
    width:100%;
    height:calc(100vh - 140px);
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

</style>

</head>
<body>

<header>
    <h1>My Architecture Portfolio</h1>
    <p>Selected Works 2022-2026</p>
</header>

<nav>

    <a href="INTERNSHIP%20PORTFOLIO.pdf#page=4"
       target="portfolioFrame">
       Farm House
    </a>

    <a href="INTERNSHIP%20PORTFOLIO.pdf#page=7"
       target="portfolioFrame">
       Campus
    </a>

    <a href="INTERNSHIP%20PORTFOLIO.pdf#page=14"
       target="portfolioFrame">
       Housing
    </a>

    <a href="INTERNSHIP%20PORTFOLIO.pdf#page=21"
       target="portfolioFrame">
       Projects
    </a>

    <a href="INTERNSHIP%20PORTFOLIO.pdf#page=23"
       target="portfolioFrame">
       Working Drawings
    </a>

    <a href="INTERNSHIP%20PORTFOLIO.pdf#page=26"
       target="portfolioFrame">
       Miscellaneous
    </a>

</nav>

<div class="pdf-container">

    <iframe
        name="portfolioFrame"
        src="INTERNSHIP%20PORTFOLIO.pdf">
    </iframe>

</div>

</body>
</html>
