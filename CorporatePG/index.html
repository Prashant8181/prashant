<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Boys PG</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      background: white;
    }

    .poster {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 🔥 FIXED WHATSAPP BUTTON */
    .whatsapp-btn {
      position: fixed;
      bottom: 25px;              /* Down side */
      right: 25px;               /* Right side */
      width: 75px;
      height: 75px;
      background: #25D366;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 42px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .whatsapp-btn:hover {
      transform: scale(1.12);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    }

    /* Tooltip */
    .whatsapp-btn::after {
      content: "Chat With Us";
      position: absolute;
      right: 90px;
      background: #111;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .whatsapp-btn:hover::after {
      opacity: 1;
    }

    /* 📱 MOBILE */
    @media (max-width: 768px) {
      .whatsapp-btn {
        width: 65px;
        height: 65px;
        font-size: 36px;
        bottom: 18px;
        right: 18px;
      }

      .whatsapp-btn::after {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Poster Image -->
  <div class="container">
    <img src="Corporate4.png" alt="Corporate Boys PG Poster" class="poster">
  </div>

  <!-- WhatsApp Floating Button -->
  <a 
   href="https://wa.me/919325447129?text=Hello%20Santosh%2C%20I%20am%20interested%20in%20the%20corporate%20boys%20PG.%20I%20wanted%20to%20check%20if%20you%20currently%20have%20any%20rooms%20available."
    class="whatsapp-btn"
    target="_blank"
    aria-label="Chat on WhatsApp"
  >
    <i class="fab fa-whatsapp"></i>
  </a>

</body>
</html>
